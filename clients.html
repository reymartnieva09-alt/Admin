<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="All past Roblox development clients and proof images from Mackenzie's portfolio."
    />
    <title>Past Clients | Mackenzie</title>
    <link rel="icon" type="image/png" href="./assets/profile-placeholder.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/output.css" />
  </head>
  <body class="bg-[var(--bg)] font-sans text-[var(--text)] antialiased">
    <header class="site-header">
      <nav class="header-nav" aria-label="Primary navigation">
        <a
          class="brand-logo"
          href="./index.html#home"
          aria-label="Go to home"
        >
          <img
            class="aspect-square w-full max-w-sm rounded-full border border-[var(--line)] bg-[var(--soft)] object-cover shadow-2xl shadow-[var(--card-shadow)]"
            src="./assets/profile-placeholder.png"
            alt="Profile photo placeholder"
          />
        </a>

        <div class="header-actions">
          <ul
            class="nav-links nav-list"
          >
            <li><a class="nav-link" href="./index.html#home">Home</a></li>
            <li><a class="nav-link" href="./index.html#about">About</a></li>
            <li><a class="nav-link" href="./index.html#projects">Projects</a></li>
            <li><a class="nav-link" href="./index.html#games">Games</a></li>
            <li><a class="nav-link" href="./index.html#skills">Skills</a></li>
            <li><a class="nav-link" href="#contact">Contact</a></li>
          </ul>

          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
            aria-pressed="false"
          >
            <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
          </button>

          <button
            class="menu-toggle"
            type="button"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
          >
            <span class="sr-only">Open menu</span>
            <span class="menu-icon relative block h-4 w-5" aria-hidden="true"></span>
          </button>
        </div>
      </nav>
    </header>

    <main>
      <section class="mx-auto min-h-[calc(100vh-5rem)] w-[min(100%-1.5rem,72rem)] py-20 lg:py-24">
        <div class="section-heading-row">
          <div>
            <p class="mb-3 text-sm font-black uppercase tracking-[0.18em] text-[var(--accent)]">Past Client</p>
            <h1 class="text-4xl font-black leading-tight sm:text-5xl">All Proof & Description</h1>
          </div>
          <a class="view-all-link" href="./index.html#services">Back Home</a>
        </div>

        <div id="client-grid" class="client-grid" aria-label="All past clients"></div>
      </section>
    </main>

    <footer id="contact" class="bg-[var(--bg)] px-4 py-7 text-white/55 site-footer">
      <div class="mx-auto grid w-[min(100%,72rem)] items-center gap-8 text-center md:grid-cols-[1fr_auto_1fr] md:text-left">
        <div>
          <h2 class="text-2xl font-black text-[#e9d7c6]">Mackenzie</h2>
          <p class="mt-2 font-bold">Roblox Game Developer</p>
        </div>

        <div class="flex items-center justify-center gap-3" aria-label="Social links">
          <a class="social-link" href="https://discord.com/users/1021299544090222674/" target="_blank" rel="noopener noreferrer" aria-label="Discord profile">
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M20.32 4.37A19.8 19.8 0 0 0 15.36 2.85a.08.08 0 0 0-.08.04c-.21.38-.45.88-.62 1.27a18.4 18.4 0 0 0-5.5 0 12.8 12.8 0 0 0-.63-1.27.08.08 0 0 0-.08-.04A19.7 19.7 0 0 0 3.5 4.37a.07.07 0 0 0-.03.03C.35 9.05-.4 13.58.02 18.06c0 .02.01.05.03.06a19.9 19.9 0 0 0 6.07 3.07.08.08 0 0 0 .09-.03c.47-.64.89-1.31 1.25-2.01a.08.08 0 0 0-.04-.11 13.1 13.1 0 0 1-1.9-.9.08.08 0 0 1-.01-.13c.13-.1.25-.2.37-.3a.08.08 0 0 1 .08-.01c3.96 1.81 8.25 1.81 12.16 0a.08.08 0 0 1 .09.01c.12.1.24.2.37.3a.08.08 0 0 1-.01.13c-.6.35-1.23.65-1.9.9a.08.08 0 0 0-.04.11c.37.7.79 1.37 1.25 2.01a.08.08 0 0 0 .09.03A19.85 19.85 0 0 0 24 18.12a.08.08 0 0 0 .03-.06c.5-5.18-.84-9.67-3.68-13.66a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.41s.96-2.41 2.16-2.41c1.21 0 2.18 1.09 2.16 2.41 0 1.33-.95 2.41-2.16 2.41Zm7.97 0c-1.18 0-2.16-1.08-2.16-2.41s.96-2.41 2.16-2.41c1.21 0 2.18 1.09 2.16 2.41 0 1.33-.95 2.41-2.16 2.41Z" />
            </svg>
          </a>
          <a class="social-link text-sm font-black" href="https://x.com/MivSong" aria-label="X profile">X</a>
          <a class="social-link" href="https://www.roblox.com/users/3718821959/profile" target="_blank" rel="noopener noreferrer" aria-label="Roblox profile">
            <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M5.16 0 24 5.16 18.84 24 0 18.84 5.16 0Zm5.34 8.7-1.8 6.6 6.6 1.8 1.8-6.6-6.6-1.8Z" />
            </svg>
          </a>
        </div>

        <p class="md:justify-self-end">&copy; <span id="year"></span> Mackenzie. All rights reserved.</p>
      </div>
    </footer>

    <div class="gallery-modal" id="client-gallery-modal" aria-hidden="true">
      <div class="gallery-modal-backdrop" data-gallery-close></div>
      <div class="gallery-modal-panel" role="dialog" aria-modal="true" aria-labelledby="client-gallery-title">
        <div class="gallery-modal-header">
          <div>
            <h2 id="client-gallery-title">Client Images</h2>
            <p id="client-gallery-count">Image 1 of 1</p>
          </div>
          <button class="gallery-modal-close" type="button" data-gallery-close aria-label="Close image gallery">Close</button>
        </div>
        <div class="gallery-modal-body">
          <button class="gallery-nav-button" id="client-gallery-prev" type="button" aria-label="View previous client image">Previous</button>
          <img id="client-gallery-image" class="gallery-modal-image" src="" alt="" />
          <button class="gallery-nav-button" id="client-gallery-next" type="button" aria-label="View next client image">Next</button>
        </div>
      </div>
    </div>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
